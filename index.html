<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="supa-shim.js"></script>
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>광운대 비전선포식 행사 현황</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one working column — progress summary on top, kind tabs, then grouped rows (name · place · qty · status · design proofs) */
:root{
  --bg:#f6f4f4; --paper:#ffffff; --ink:#221b1c; --muted:#6e6365; --line:#e4dcdd;
  --accent:#8b2332; --accent-soft:#f3e3e5;
  --todo:#9a8f90; --done:#1f7a52; --prog:#b7791f; --fin:#2b5fa8; --pend:#c9a400;
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161213;--paper:#1f191a;--ink:#efe7e8;--muted:#a89c9e;--line:#3a3032;--accent:#e0788a;--accent-soft:#3a2328;--todo:#8c8183;--done:#4cc290;--prog:#e3a94a;--fin:#7fa8e8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161213;--paper:#1f191a;--ink:#efe7e8;--muted:#a89c9e;--line:#3a3032;--accent:#e0788a;--accent-soft:#3a2328;--todo:#8c8183;--done:#4cc290;--prog:#e3a94a;--fin:#7fa8e8;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 48px;display:grid;gap:18px}
h1{margin:0;font-size:24px;text-wrap:balance}
.meta{color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:4px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.card .lab{font-size:12px;color:var(--muted);letter-spacing:.04em}
.card b{display:block;font-size:26px;font-variant-numeric:tabular-nums;margin:2px 0 8px}
.card b small{font-size:14px;color:var(--muted);font-weight:500}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;display:flex}
.bar i{height:100%}
.bar .d{background:var(--done)}.bar .p{background:var(--prog)}.bar .f{background:var(--fin)}
.ctrl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font:inherit;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.tabs button:focus-visible,select:focus-visible,.up:focus-visible,.th:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.chk{display:inline-flex;gap:6px;align-items:center;color:var(--muted);font-size:13px;cursor:pointer}
.grp{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.grp h2{margin:0;font-size:13px;padding:10px 16px;background:var(--accent-soft);color:var(--ink);display:flex;justify-content:space-between;gap:8px}
.grp h2 span{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.row{display:grid;grid-template-columns:minmax(0,1fr) 84px 138px;gap:6px 14px;padding:12px 16px;border-top:1px solid var(--line);align-items:start}
.row:first-of-type{border-top:0}
.nm{font-weight:700}
.nm .k{font:500 11px var(--mono);color:var(--muted);margin-right:6px}
.loc{color:var(--muted);font-size:13px}
.note{font-size:12.5px;color:var(--muted);margin-top:2px}
.qty{font-variant-numeric:tabular-nums;text-align:right;padding-top:1px}
select{font:inherit;font-size:13px;width:100%;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:5px 6px;border-left-width:5px}
select[data-s="0"]{border-left-color:var(--todo)}
select[data-s="1"]{border-left-color:var(--done)}
select[data-s="2"]{border-left-color:var(--prog)}
select[data-s="3"]{border-left-color:var(--fin)}
select:disabled{opacity:.85}
.proofs{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.th{width:72px;height:72px;border-radius:8px;border:1px solid var(--line);object-fit:cover;cursor:zoom-in;background:var(--bg);padding:0}
.th img{width:100%;height:100%;object-fit:cover;border-radius:7px;display:block}
.tw{position:relative;display:inline-block}
.del{position:absolute;top:-7px;right:-7px;min-width:24px;height:24px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:700 13px var(--sans);cursor:pointer;padding:0 6px;line-height:1}
.del.arm{background:#c92a2a;color:#fff;border-color:#c92a2a}
.del:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.up{font:inherit;font-size:12.5px;border:1px dashed var(--muted);color:var(--muted);background:transparent;border-radius:8px;padding:6px 10px;cursor:pointer}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.lb{position:fixed;inset:0;background:rgba(10,8,8,.82);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:20}
.lb[hidden]{display:none}
.lb img{max-width:100%;max-height:82vh;border-radius:8px;background:#fff}
.lb p{color:#fff;margin:10px 0 0;text-align:center}
.lb button{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));font:inherit;background:#fff;color:#111;border:0;border-radius:999px;padding:6px 12px;cursor:pointer}
.msg{font-size:12.5px;color:var(--muted)}
.mapc[hidden]{display:none}
.mapc{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.maph{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 14px;padding:10px 16px;font-size:13px}
.maph b{font-size:13px}
.lg{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted);font-size:12.5px}
.lg i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.plan{position:relative}
.plan img{display:block;width:100%;height:auto}
.plan svg{position:absolute;inset:0;width:100%;height:100%}
.pin{cursor:pointer}
.pin text{font:700 17px var(--mono);fill:#fff;pointer-events:none}
.pin:focus-visible circle,.pin:focus-visible rect{stroke:#ffd400;stroke-width:6}
.prbtn{font:inherit;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}.prbtn:disabled{opacity:.5}
.addbtn{font:inherit;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:999px;padding:6px 14px;cursor:pointer}
.addf{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px 12px;align-items:end}
.addf[hidden]{display:none}
.addf label{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
.addf input,.addf select{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
.addf .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.addf button{font:inherit;border-radius:8px;padding:7px 12px;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.addf button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.addf .fh{grid-column:1/-1;margin:0;font-size:15px}
.addf .chk[hidden]{display:none}
.pins-ed{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 8px;font-size:12.5px;color:var(--muted);align-items:center}
.pins-ed .pe{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:8px;padding:3px 4px 3px 8px;background:var(--bg)}
.pins-ed .pe input{width:130px;padding:4px 6px;font-size:13px}
.pins-ed .pe button{padding:3px 8px}
.lnk{font-size:12.5px;margin-top:3px}
.who{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:4px;font-size:13px}
.who .wl{font-size:11.5px;color:var(--muted)}
.who b{font-size:14px;padding:1px 9px;border-radius:999px;background:var(--accent-soft);color:var(--ink)}
.who .none{color:var(--muted);font-style:normal;padding:1px 9px;border:1px dashed var(--line);border-radius:999px}
.addf label[hidden]{display:none}
.lnk a{color:var(--accent);font-weight:500}
.card .tot{font-size:12px;color:var(--muted);margin-top:8px}.card .tot b{color:var(--ink);font-size:13px}
.prc{font-size:13px;margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}.prc .wl{font-size:11.5px;color:var(--muted)}.prc b{font-variant-numeric:tabular-nums}.prc .pn{color:var(--muted);font-size:12px}
.mv.fx{color:var(--accent)}
.lnk a+a{margin-left:4px}.lned{display:grid;gap:4px;justify-items:start}.lni{font:inherit;font-size:13px;width:min(100%,360px);padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.row.hs{grid-template-columns:minmax(0,1fr) 64px 220px}.row.hs>div:first-child{grid-row:span 2}
.side{grid-column:2/-1;display:grid;gap:6px;align-content:start}
.pay{display:flex;flex-wrap:wrap;gap:6px}
.pay select.ps{width:auto;flex:1 1 96px;border-left-width:5px;border-left-color:var(--line)}.pay select.ps[data-v=""]{color:var(--muted)}
.pay select[data-pf="paid"][data-v="결제 진행중"]{border-left-color:var(--prog)}.pay select[data-pf="paid"][data-v="결제 완료"]{border-left-color:var(--done)}
.pay.ro span{font-size:12px;padding:1px 9px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}.pay.ro .pd{color:var(--prog);border-color:var(--prog)}.pay.ro .pd.ok{color:var(--done);border-color:var(--done)}
.memo{font:inherit;font-size:13px;width:100%;min-height:54px;resize:vertical;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);box-sizing:border-box}
.memo::placeholder{color:var(--muted)}.memo.ro{min-height:0;white-space:pre-wrap;overflow-wrap:anywhere}
.prc input{font:inherit;font-size:13px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.lnk.vd .wl{font-size:11.5px;color:var(--muted)}.lnk.vd b{font-size:13px}
.rm,.mv{font:inherit;font-size:11.5px;border:0;background:none;color:var(--muted);cursor:pointer;padding:2px 4px;text-decoration:underline}
.rm.arm{color:#c92a2a;font-weight:700}
.plan.picking svg{cursor:crosshair}
.plan.picking{outline:3px solid var(--accent);outline-offset:-3px}
.vjc{padding:12px 16px;border-top:1px solid var(--line)}
.vjc.pre{background:var(--bg)}
.vjh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.vno{font:500 12px var(--mono);color:var(--muted);min-width:22px}
.vtm{font:500 13px var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}.vtm small{color:var(--muted);font-size:11.5px}
.vit{font-size:15px}.vde{color:var(--muted);font-size:13.5px}
.vjm{display:flex;flex-wrap:wrap;gap:4px 14px;margin:6px 0 0 34px;font-size:12.5px}.vjm i{font-style:normal;color:var(--muted);margin-right:5px;font-size:11.5px}
.vjr{margin:4px 0 0 34px;font-size:12px;color:var(--accent)}
.vjs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin:10px 0 0 34px;align-items:start}
.scr{border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--paper);display:grid;gap:5px}
.sbox{position:relative;aspect-ratio:5/1;border-radius:5px;background:var(--bg);border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
.scr.has .sbox{border-style:solid;background:#000}
.simg{all:unset;display:block;width:100%;height:100%;cursor:zoom-in}.simg img{width:100%;height:100%;object-fit:contain;display:block}
.slab{display:flex;gap:4px;align-items:center}.slab .rm{white-space:nowrap}.slab input,.slnk input{font:inherit;font-size:12.5px;color:var(--ink);background:transparent;border:1px solid transparent;border-radius:5px;padding:3px 5px;width:100%;min-width:0}
.slab input{font-weight:700}.slab input:hover,.slnk input:hover,.slab input:focus,.slnk input:focus{border-color:var(--line);background:var(--bg)}
.slnk{display:flex;gap:6px;align-items:center;font-size:12px}.slnk a{color:var(--accent);white-space:nowrap}
.sadd{font:inherit;font-size:12.5px;border:1px dashed var(--muted);color:var(--muted);background:transparent;border-radius:8px;padding:8px 12px;cursor:pointer;align-self:center}
.vjf{display:flex;flex-wrap:wrap;gap:8px}.vjf label{display:grid;gap:3px;font-size:11.5px;color:var(--muted);min-width:0}
.vjf input{font:inherit;font-size:13.5px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
.vjact{display:flex;gap:8px;margin-top:10px;align-items:center}.vjact button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}.vjact .pri{background:var(--accent);border-color:var(--accent);color:#fff}.vjact .rm{border:0;background:none;color:var(--muted)}
@media (max-width:560px){.vjm,.vjr,.vjs{margin-left:0}}

.row.ied{display:block;background:var(--accent-soft)}
.iedf{display:flex;flex-wrap:wrap;gap:8px 10px}.iedf label{display:grid;gap:3px;font-size:11.5px;color:var(--muted);min-width:0}
.iedf input,.iedf select{box-sizing:border-box;font:inherit;font-size:13.5px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0;width:100%}
.iedf label.chk{display:inline-flex}.iedf label.chk input{width:auto}
.row.ied .pins-ed{margin-top:8px}.row.ied .pins-ed .pe{background:var(--paper)}
.iea{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.iea button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:6px 14px;cursor:pointer}.iea .pri{background:var(--accent);border-color:var(--accent);color:#fff}
select.sx{width:auto;font-size:12px;padding:2px 4px;border-left-width:1px;margin-left:2px}
.rcz{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;padding:6px 8px;border:1px dashed var(--line);border-radius:8px;font-size:12.5px;transition:background .15s,border-color .15s}
.rcz.big{min-height:64px;padding:12px 14px}.rcwrap{padding:12px 16px}
.rcz .wl{font-size:11.5px;color:var(--muted)}.rcz.over{border-color:var(--accent);background:var(--accent-soft)}
.rcc{position:relative;display:inline-flex}.rci{width:44px;height:44px;padding:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;cursor:zoom-in;background:var(--bg)}.rci img{width:100%;height:100%;object-fit:cover;display:block}
.rcf{display:inline-block;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--accent);text-decoration:none;font-weight:500}
.rcx{position:absolute;top:-7px;right:-7px;min-width:20px;height:20px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:700 11px var(--sans);cursor:pointer;padding:0 5px;line-height:1}.rcx.arm{background:#c92a2a;color:#fff;border-color:#c92a2a}
.rcadd{font:inherit;font-size:12px;border:0;background:none;color:var(--muted);cursor:pointer;text-decoration:underline;padding:4px}
.authbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;font-size:13px;color:var(--muted)}
.authbar form{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.authbar input{font:inherit;font-size:13px;padding:5px 9px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);min-width:160px}
.authbar button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;cursor:pointer}
.row.hl{background:var(--accent-soft);transition:background .3s}
@media (max-width:560px){.row,.row.hs{grid-template-columns:minmax(0,1fr) 120px}.row.hs>div:first-child{grid-row:auto}.qty{grid-column:2;grid-row:1;text-align:right}.row>select{grid-column:1/-1}.side{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>광운대 비전선포식 행사 현황</h1>
    <div class="meta"><span>2026.10.29(목) 광운스퀘어</span><span>인력 · 디자인 · 대여 · 구매 · VJ</span><span id="who"></span></div>
    <div id="authbar" class="authbar"></div>
  </header>
  <section class="sum" id="sum" aria-label="진행 요약"></section>
  <div class="ctrl">
    <div class="tabs" role="group" aria-label="보기">
      <button type="button" data-k="staff" aria-pressed="false">인력</button>
      <button type="button" data-k="design" aria-pressed="true">디자인</button>
      <button type="button" data-k="rent" aria-pressed="false">대여</button>
      <button type="button" data-k="buy" aria-pressed="false">구매</button>
      <button type="button" data-k="vj" aria-pressed="false">VJ</button>
      <button type="button" data-k="all" aria-pressed="false">전체</button>
    </div>
    <div class="acts" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><label class="chk"><input type="checkbox" id="open-only"> 아직 안 끝난 것만</label><button type="button" class="prbtn" id="printbtn">🖨 인쇄용 PDF</button><button type="button" class="addbtn" id="addbtn" hidden>+ 항목 추가</button></div>
  </div>
  <section class="mapc" id="mapc" aria-label="도면 위 디자인 현황">
    <div class="maph"><b id="mapt">도면으로 보기 · 디자인 위치</b><span class="lg" id="lgd"></span></div>
    <div class="plan"><img src="plaza.jpg" alt="광운스퀘어 원형광장 조감도"><svg id="pins" viewBox="0 0 1672 941" aria-label="디자인 위치 표시"></svg></div>
    <div class="maph"><span class="lg" id="maphint"></span></div>
  </section>
  <form class="addf" id="addf" hidden aria-label="항목 추가·수정">
    <h3 class="fh" id="f-h">새 항목 추가</h3>
    <label>종류<select id="f-kind"><option value="design">디자인</option><option value="rent">대여</option><option value="buy">구매</option><option value="staff">인력</option></select></label>
    <label>구분<input id="f-cat" list="cats" placeholder="예: 리셉션" required></label>
    <label><span id="f-name-l">물품명</span><input id="f-name" placeholder="예: 포토월" required></label>
    <label id="f-who-w" hidden>담당자 이름<input id="f-who" placeholder="예: 김채원 (비우면 미정)"></label>
    <label id="f-sex-w" hidden>성별<select id="f-sex"><option value="">선택 안 함</option><option value="남">남</option><option value="여">여</option></select></label>
    <label id="f-qty-w">수량<input id="f-qty" placeholder="예: 2"></label>
    <label>위치<input id="f-loc" placeholder="예: 진입 계단 아래"></label>
    <label>메모<input id="f-note" placeholder="선택"></label>
    <label>표시 번호<input id="f-code" placeholder="선택 · 예: X11"></label>

    <label id="f-vlink-w" hidden>업체 링크<input id="f-vlink" type="url" placeholder="https:// 주문·견적 페이지"></label>

    <label class="chk" id="f-opsw"><span><input type="checkbox" id="f-ops"> 운영텐트 보관 묶음에 넣기</span></label>

  </form>
  <main id="list"><div class="grp"><div class="empty">목록을 불러오는 중이에요…</div></div></main>
  <p class="msg" id="msg">상태는 바로 저장돼요. 디자인 항목은 ‘시안 올리기’로 완성본을 붙이고, 썸네일의 ×를 두 번 누르면 지워져요.</p>
</div>
<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="디자인 보기"><button type="button" id="lbx">닫기</button><div><img id="lbimg" alt=""><p id="lbcap"></p></div></div>

<script>
const ST={design:['미착수','디자인 완료','출력 발주','설치 완료'],rent:['미발주','발주 완료','입고 완료'],buy:['미구매','주문 완료','입고 완료'],staff:['미배정','배정 완료','당일 확인']};
const KN={design:'디자인',rent:'대여',buy:'구매',staff:'인력'};
let rows=[],kind='design',openOnly=false,db=null,assets=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// 링크: 첫 번째는 link, 나머지는 links 배열
const linksOf=r=>[r.link,...(r.links||[])].filter(Boolean);
const hostOf=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return '링크'}};
// 오른쪽 칸: 대여·구매는 결제 방식/세금계산서/결제 상태, 물품(디자인·대여·구매)은 메모
function sideHTML(r){
  if(r.kind==='staff')return '';const ed=ED();let h='';
  if(r.kind==='buy'||r.kind==='rent'){
    const sel=(f,val,opts,lab)=>`<select class="ps" data-pf="${f}" data-rid="${r.id}" data-v="${esc(val)}" aria-label="${esc(r.name)} ${lab}"><option value="">${lab}</option>${opts.map(o=>`<option${val===o?' selected':''}>${o}</option>`).join('')}</select>`;
    if(ed)h+=`<div class="pay">${sel('pay',r.pay||'',['계좌','카드'],'결제 방식')}${r.pay==='계좌'?sel('tax',r.tax||'',['발행','미발행'],'세금계산서'):''}${sel('paid',r.paid||'',['결제 진행중','결제 완료'],'결제 상태')}</div>`;
    else if(r.pay||r.paid)h+=`<div class="pay ro">${r.pay?`<span>${esc(r.pay)}</span>`:''}${r.pay==='계좌'&&r.tax?`<span>세금계산서 ${esc(r.tax)}</span>`:''}${r.paid?`<span class="pd${r.paid==='결제 완료'?' ok':''}">${esc(r.paid)}</span>`:''}</div>`}
  if(ed)h+=`<textarea class="memo" data-memo="${r.id}" rows="2" placeholder="메모" aria-label="${esc(r.name)} 메모">${esc(r.memo||'')}</textarea>`;
  else if(r.memo)h+=`<div class="memo ro">${esc(r.memo)}</div>`;
  return h?`<div class="side">${h}</div>`:''}
const doneOf=r=>r.kind==='design'||r.kind==='staff'?(r.st||0)>=1:(r.st||0)>=2;

let canW=null,meInfo=null;const ED=()=>!!db&&canW===true;
function failMsg(err,what){const c=err&&(err.code||err.name)||'오류';$('#msg').textContent=canW===false?`${what}하지 못했어요. ${meInfo?`${meInfo} 계정은 편집자 명단에 없어요. 아린 님에게 추가를 요청해 주세요.`:'편집하려면 위쪽에 편집 비밀번호를 넣어 주세요.'}`:`${what}하지 못했어요 (${c}). 편집 비밀번호로 들어왔는지 확인해 주세요.`}
const won=n=>Math.round(n).toLocaleString('ko-KR')+'원';const sub=r=>(+r.price||0)*(+r.pq||1);const shipOf=r=>{const f=+r.shipFee||0;if(!f)return 0;return +r.shipFree>0&&sub(r)>=+r.shipFree?0:f};const tot=r=>sub(r)+(+r.price>0?shipOf(r):0);
const shipTxt=r=>{const f=+r.shipFee||0,t=+r.shipFree||0;if(!f)return r.shipNote?esc(r.shipNote):'';const c=shipOf(r);return c?`+ 배송비 ${won(c)}${t?` <span class="pn">(${won(t)} 이상 무료 · ${won(t-sub(r))} 모자람)</span>`:''}`:`· 배송비 무료 <span class="pn">(${won(t)} 이상 무료 조건 충족)</span>`};
function summary(){
  const card=(k)=>{const rs=rows.filter(r=>r.kind===k),n=rs.length;const c=[0,0,0,0];rs.forEach(r=>c[r.st||0]++);
    const done=rs.filter(doneOf).length;const w=i=>n?c[i]/n*100:0;
    const bar=k==='staff'?`<i class="d" style="width:${w(1)}%"></i><i class="f" style="width:${w(2)}%"></i>`:k==='design'?`<i class="d" style="width:${w(1)}%"></i><i class="p" style="width:${w(2)}%"></i><i class="f" style="width:${w(3)}%"></i>`:`<i class="p" style="width:${w(1)}%"></i><i class="d" style="width:${w(2)}%"></i>`;
    return `<div class="card"><div class="lab">${KN[k]} ${k==='design'?'완성':k==='staff'?'배정':'확보'}</div><b>${done}<small> / ${n}</small></b><div class="bar">${bar}</div>${k==='buy'||k==='rent'?`<div class="tot">예상 합계 <b>${won(rs.reduce((a,r)=>a+tot(r),0))}</b> · 가격 미입력 ${rs.filter(r=>!(+r.price>0)).length}건 · ${k==='rent'?`영수증 ${rentRc.length}개`:`영수증 ${rs.filter(r=>(r.rcpts||[]).length).length}/${n}`}</div>`:''}</div>`};
  $('#sum').innerHTML=card('staff')+card('design')+card('rent')+card('buy')+(vj.length?vjCard():'');
}
const ANCH={recep:[1533,491]};
const OPSAT=[858,159];
const D=(x,y)=>[(x*1.12-417)*1.03851,(y*1.12-37)*1.03978];
const CL={design:['--todo','--done','--prog','--fin'],rent:['--todo','--prog','--done'],buy:['--todo','--prog','--done'],staff:['--todo','--done','--fin']};
const colOf=r=>(CL[r.kind]||CL.rent)[r.st||0];
const NS='http://www.w3.org/2000/svg';
const mk=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};
const wOf=lab=>Math.max(40,[...lab].reduce((a,c)=>a+(/[가-힣]/.test(c)?19:/[×·]/.test(c)?12:11),0)+22);
function goRow(r){const s=document.getElementById('st-'+r.id);if(s){const row=s.closest('.row');row.scrollIntoView({block:'center',behavior:'smooth'});row.classList.add('hl');setTimeout(()=>row.classList.remove('hl'),1600)}}
function pill(svg,X,Y,lab,col,aria,go,dot){const g=mk('g',{class:'pin',tabindex:0,role:'button','aria-label':aria},svg);const w=wOf(lab);
  mk('rect',{x:X-w/2,y:Y-19,width:w,height:38,rx:19,style:`fill:var(${col});stroke:#fff;stroke-width:3`},g);mk('text',{x:X,y:Y+6,'text-anchor':'middle'},g).textContent=lab;
  if(dot)mk('circle',{cx:X+w/2-4,cy:Y-17,r:7,style:'fill:#fff;stroke:#111;stroke-width:2'},g);
  g.addEventListener('click',go);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}})}
function legend(k){const kk=k==='all'?'design':k;const s=ST[kk];const cols=CL[kk];
  $('#lgd').innerHTML=s.map((x,i)=>`<span><i style="background:var(${cols[i]})"></i>${x}</span>`).join('');
  $('#mapt').textContent='도면으로 보기 · '+(k==='rent'?'대여 물품 위치':k==='buy'?'구매 물품 위치':k==='staff'?'인력 배치':'디자인 위치');
  $('#maphint').textContent=k==='staff'?'R 광운대 의전 · S 안전 운영 · K 큐비크스 · O 운영 알바. 표시를 누르면 아래 목록의 해당 줄로 이동해요.':k==='rent'||k==='buy'?'숫자는 그 자리에 놓는 수량이에요. 표시를 누르면 아래 목록의 해당 줄로 이동해요.':'표시를 누르면 시안이 있으면 크게 보이고, 없으면 아래 목록의 해당 줄로 이동해요.'}
const autoLab=r=>r.kind==='staff'?((r.code||r.name)+(r.who?' '+r.who:'')):r.kind==='design'?(r.code||r.name):(r.name+(r.qty&&r.qty!=='—'&&r.qty!=='미정'?' '+r.qty:''));
function openImg(r){$('#lbimg').src=BLOB(r.imgs[0]);$('#lbcap').textContent=r.name+(r.loc?' · '+r.loc:'');$('#lb').hidden=false;$('#lbx').focus()}
function renderMap(){
  const svg=$('#pins');svg.innerHTML='';legend(kind);
  const k=kind==='all'?'design':kind,ed=pend&&pend.edit?pend.id:null;
  if(k!=='design'){const [X,Y]=ANCH.recep;mk('text',{x:X,y:Y-32,'text-anchor':'middle',style:'font:700 17px var(--sans);fill:#fff;paint-order:stroke;stroke:#111;stroke-width:4px'},svg).textContent='리셉션 (건물 내부)'}
  const ops=[];
  rows.filter(r=>r.kind===k).forEach(r=>{if(r.ops)ops.push(r);if(r.id===ed)return;
    const has=r.kind==='design'&&(r.imgs||[]).length;
    (r.pins||[]).forEach(p=>{const lab=r.kind==='staff'&&p.l?p.l+(r.who?' '+r.who:''):p.l||autoLab(r);
      pill(svg,p.x,p.y,lab,colOf(r),`${lab} ${r.name}${r.kind==='staff'?' 담당 '+(r.who||'미정'):''} ${r.loc||''} ${ST[r.kind][r.st||0]}`,()=>{if(has)openImg(r);else goRow(r)},has)})});
  if(ops.length){const done=ops.filter(doneOf).length,col=done===ops.length?'--done':done?'--prog':'--todo';
    pill(svg,OPSAT[0],OPSAT[1],`운영텐트 보관 ${done}/${ops.length}`,col,`운영텐트 보관 물품 ${ops.length}종 중 ${done}종 확보`,()=>goRow(ops.find(r=>!doneOf(r))||ops[0]))}
  if(pend&&pend.pins){const nm=$('#f-name').value.trim()||'새 항목';
    pend.pins.forEach((p,i)=>pill(svg,p.x,p.y,p.l||($('#f-code').value.trim()||nm),'--pend','편집 중인 위치 '+(i+1),()=>{}))}
}
function render(){
  const fa=document.activeElement,fm=fa&&fa.dataset&&fa.dataset.memo?{id:fa.dataset.memo,v:fa.value,a:fa.selectionStart,b:fa.selectionEnd}:null;
  summary();const isVJ=kind==='vj';$('#mapc').hidden=isVJ;$('#addbtn').hidden=isVJ||!ED();if(isVJ){if(!$('#addf').hidden)closeForm();renderVJ();return}
  renderMap();
  let rs=rows.filter(r=>kind==='all'||r.kind===kind);
  if(openOnly) rs=rs.filter(r=>!doneOf(r));
  if(!rows.length){$('#list').innerHTML='<div class="grp"><div class="empty">아직 등록된 항목이 없어요. Claude에게 목록을 채워 달라고 하면 여기에 나타나요.</div></div>';return}
  if(!rs.length){$('#list').innerHTML='<div class="grp"><div class="empty">이 보기에서는 모두 끝났어요.</div></div>';return}
  const groups=[];rs.forEach(r=>{const key=(kind==='all'?KN[r.kind]+' · ':'')+r.cat;let g=groups.find(x=>x.k===key);if(!g)groups.push(g={k:key,rs:[]});g.rs.push(r)});
  $('#list').innerHTML=(kind==='rent'?rentRcHTML():'')+groups.map(g=>`<section class="grp"><h2>${esc(g.k)}<span>${g.rs.filter(doneOf).length}/${g.rs.length}</span></h2>${g.rs.map(r=>{
    const opts=ST[r.kind].map((s,i)=>`<option value="${i}"${(r.st||0)===i?' selected':''}>${s}</option>`).join('');
    const imgs=(r.imgs||[]).map((id,i)=>`<span class="tw"><button type="button" class="th" data-img="${esc(id)}" data-cap="${esc(r.name+(r.loc?' · '+r.loc:''))}" aria-label="${esc(r.name)} 시안 ${i+1} 크게 보기"><img src="${esc(BLOB(id))}" alt="" loading="lazy"></button>${ED()?`<button type="button" class="del" data-del="${r.id}" data-aid="${esc(id)}" aria-label="${esc(r.name)} 시안 ${i+1} 삭제">×</button>`:''}</span>`).join('');
    const proofs=r.kind==='design'?`<div class="proofs">${imgs}${assets&&ED()?`<button type="button" class="up" data-up="${r.id}">시안 올리기</button>`:''}</div>`:'';
    if(ie&&ie.id===r.id)return ieHTML(r);const side=sideHTML(r);
    return `<div class="row${r.kind!=='staff'?' hs':''}"><div><div class="nm">${r.code?`<span class="k">${esc(r.code)}</span>`:''}${esc(r.name)}${ED()?` <button type="button" class="mv" data-ed="${r.id}">수정</button><button type="button" class="rm" data-rm="${r.id}">삭제</button>`:''}</div>${r.kind==='staff'?`<div class="who"><span class="wl">담당</span>${r.who?`<b>${esc(r.who)}</b>`:'<i class="none">미정</i>'}${ED()?sexSel(r.sex,`data-sx="${r.id}" aria-label="${esc(r.name)} 성별"`):r.sex?` <span class="wl">${esc(r.sex)}</span>`:''}${ED()?`<button type="button" class="mv" data-wh="${r.id}">${r.who?'이름 변경':'이름 넣기'}</button>`:''}</div>`:''}${r.loc?`<div class="loc">${esc(r.loc)}</div>`:''}${r.note?`<div class="note">${esc(r.note)}</div>`:''}${r.kind==='design'?`<div class="lnk vd"><span class="wl">인쇄 업체</span> ${r.vendor?`<b>${esc(r.vendor)}</b>`:'<span class="loc">미정</span>'}${r.vlink&&/^https?:\/\//.test(r.vlink)?` <a href="${esc(r.vlink)}" target="_blank" rel="noopener">업체 링크 ↗</a>`:''}${ED()?` <button type="button" class="mv" data-vd="${r.id}">${r.vendor||r.vlink?'업체 수정':'업체 넣기'}</button>`:''}</div>`:''}${r.kind==='buy'||r.kind==='rent'?`<div class="prc"><span class="wl">가격</span>${+r.price>0?`${won(+r.price)}${r.pn?` <span class="pn">(${esc(r.pn)})</span>`:''} × ${+r.pq||1}${shipTxt(r)?' '+shipTxt(r):''} = <b>${won(tot(r))}</b>`:'<span class="pn">미입력</span>'}${ED()?` <button type="button" class="mv" data-pr="${r.id}">${+r.price>0?'가격 수정':'가격 넣기'}</button>`:''}</div>`:''}${r.kind==='buy'||(linksOf(r).length&&r.kind!=='design')?`<div class="lnk">${linksOf(r).length?linksOf(r).map((u,i)=>/^https?:\/\//.test(u)?`<a href="${esc(u)}" target="_blank" rel="noopener" title="${esc(u)}">${i?`링크 ${i+1} · ${esc(hostOf(u))}`:'구매 링크'} ↗</a>`:'').join(' '):'<span class="loc">링크 없음</span>'}${ED()?` <button type="button" class="mv" data-ln="${r.id}">${linksOf(r).length?'링크 수정':'링크 넣기'}</button>`:''}${ED()&&mcp&&r.kind==='buy'&&r.link?` <button type="button" class="mv fx" data-fetch="${r.id}">가격 가져오기</button>`:''}</div>`:''}${r.kind==='buy'?rcHTML(r):''}</div><div class="qty">${r.kind==='staff'?'':esc(r.qty)}</div><select id="st-${r.id}" data-id="${r.id}" data-s="${r.st||0}" aria-label="${esc(r.name)} 상태"${ED()?'':' disabled'}>${opts}</select>${side}${proofs}</div>`}).join('')}</section>`).join('');
  if(fm){const t=document.querySelector(`[data-memo="${fm.id}"]`);if(t){t.value=fm.v;t.focus();t.setSelectionRange(fm.a,fm.b)}}
}
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{kind=b.dataset.k;document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-pressed',x===b));try{localStorage.setItem('tab',kind)}catch(e){}render()}));
try{const t=localStorage.getItem('tab');if(t){kind=t;document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.k===t))}}catch(e){}
$('#open-only').addEventListener('change',e=>{openOnly=e.target.checked;render()});
$('#list').addEventListener('change',async e=>{const s=e.target.closest('select[data-id]');if(!s||!db)return;const v=+s.value;s.dataset.s=v;
  const me=rows.find(x=>x.id===s.dataset.id),grp=me&&me.grp?rows.filter(x=>x.grp===me.grp):[me];
  try{for(const x of grp)await db.doc('items/'+x.id).update({st:v});$('#msg').textContent=grp.length>1?`같은 디자인 ${grp.length}곳을 함께 저장했어요.`:'저장했어요.'}catch(err){failMsg(err,'저장');render()}});
$('#list').addEventListener('change',async e=>{if(!db)return;
  const p=e.target.closest('select.ps');if(p){const v=p.value;p.dataset.v=v;
    try{await db.doc('items/'+p.dataset.rid).update({[p.dataset.pf]:v});$('#msg').textContent='저장했어요.'}catch(err){failMsg(err,'저장');render()}return}
  const m=e.target.closest('[data-memo]');if(m){const id=m.dataset.memo,v=m.value.trim();
    try{await db.doc('items/'+id).update({memo:v});$('#msg').textContent=v?'메모를 저장했어요.':'메모를 지웠어요.'}catch(err){failMsg(err,'저장')}}});
const lnInp=v=>`<input type="url" class="lni" value="${esc(v)}" placeholder="https://" aria-label="링크">`;
$('#list').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('lni')){e.preventDefault();e.target.closest('.lned').querySelector('[data-lnsave]').click()}});
const fileIn=Object.assign(document.createElement('input'),{type:'file',accept:'image/*,application/pdf',multiple:true});let upFor=null;
fileIn.addEventListener('change',async()=>{const r=rows.find(x=>x.id===upFor);if(!r||!fileIn.files.length)return;$('#msg').textContent='올리는 중이에요…';
  try{const ids=[...(r.imgs||[])];for(const f of fileIn.files){const res=await assets.upload(f);ids.push(res.id)}
    const grp=r.grp?rows.filter(x=>x.grp===r.grp):[r];
    for(const x of grp){const patch={imgs:ids};if((x.st||0)<1)patch.st=1;await db.doc('items/'+x.id).update(patch)}
    $('#msg').textContent=grp.length>1?`같은 디자인 ${grp.length}곳에 시안을 붙이고 디자인 완료로 표시했어요.`:'시안을 붙이고 디자인 완료로 표시했어요.'}
  catch(err){$('#msg').textContent='올리지 못했어요 ('+(err&&err.code||'오류')+').'}fileIn.value=''});
$('#list').addEventListener('click',async e=>{const u=e.target.closest('[data-up]');if(u){upFor=u.dataset.up;fileIn.click();return}

    const tbl=sec.querySelector('table'),grid=sec.querySelector('.cards'),h=sec.querySelector('h1,h2');
    if(!tbl&&!grid){const p=newPg();while(sec.firstChild)p.appendChild(sec.firstChild);return}
    const items=[...(tbl?tbl.tBodies[0].rows:grid.children)];let p,box,cont=false;
    const start=()=>{p=newPg();const hh=h.cloneNode(true);if(cont)hh.insertAdjacentHTML('beforeend',' <small>(이어서)</small>');p.appendChild(hh);
      if(tbl){const t=document.createElement('table');t.appendChild(tbl.tHead.cloneNode(true));box=document.createElement('tbody');t.appendChild(box);p.appendChild(t)}else{box=document.createElement('div');box.className='cards';p.appendChild(box)}};
