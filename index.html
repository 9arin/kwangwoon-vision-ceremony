<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="config.js"></script>

<style>body{margin:0}[hidden]{display:none!important}</style>
<title>광운대 비전선포식 행사 현황</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one working column — progress summary on top, kind tabs, then grouped rows (name · place · qty · status · design proofs) */
:root{
  --bg:#f6f4f4; --paper:#ffffff; --ink:#221b1c; --muted:#6e6365; --line:#e4dcdd;
  --accent:#8b2332; --accent-soft:#f3e3e5;
  --todo:#9a8f90; --done:#1f7a52; --prog:#b7791f; --fin:#2b5fa8; --pend:#c9a400;
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161213;--paper:#1f191a;--ink:#efe7e8;--muted:#a89c9e;--line:#3a3032;--accent:#e0788a;--accent-soft:#3a2328;--todo:#8c8183;--done:#4cc290;--prog:#e3a94a;--fin:#7fa8e8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161213;--paper:#1f191a;--ink:#efe7e8;--muted:#a89c9e;--line:#3a3032;--accent:#e0788a;--accent-soft:#3a2328;--todo:#8c8183;--done:#4cc290;--prog:#e3a94a;--fin:#7fa8e8;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 48px;display:grid;gap:18px}
h1{margin:0;font-size:24px;text-wrap:balance}
.meta{color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:4px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.card .lab{font-size:12px;color:var(--muted);letter-spacing:.04em}
.card b{display:block;font-size:26px;font-variant-numeric:tabular-nums;margin:2px 0 8px}
.card b small{font-size:14px;color:var(--muted);font-weight:500}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;display:flex}
.bar i{height:100%}
.bar .d{background:var(--done)}.bar .p{background:var(--prog)}.bar .f{background:var(--fin)}
.ctrl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font:inherit;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.tabs button:focus-visible,select:focus-visible,.up:focus-visible,.th:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.chk{display:inline-flex;gap:6px;align-items:center;color:var(--muted);font-size:13px;cursor:pointer}
.grp{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.grp h2{margin:0;font-size:13px;padding:10px 16px;background:var(--accent-soft);color:var(--ink);display:flex;justify-content:space-between;gap:8px}
.grp h2 span{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.row{display:grid;grid-template-columns:minmax(0,1fr) 84px 138px;gap:6px 14px;padding:12px 16px;border-top:1px solid var(--line);align-items:start}
.row:first-of-type{border-top:0}
.nm{font-weight:700}
.nm .k{font:500 11px var(--mono);color:var(--muted);margin-right:6px}
.loc{color:var(--muted);font-size:13px}
.note{font-size:12.5px;color:var(--muted);margin-top:2px}
.qty{font-variant-numeric:tabular-nums;text-align:right;padding-top:1px}
select{font:inherit;font-size:13px;width:100%;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:5px 6px;border-left-width:5px}
select[data-s="0"]{border-left-color:var(--todo)}
select[data-s="1"]{border-left-color:var(--done)}
select[data-s="2"]{border-left-color:var(--prog)}
select[data-s="3"]{border-left-color:var(--fin)}
select:disabled{opacity:.85}
.proofs{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.th{width:72px;height:72px;border-radius:8px;border:1px solid var(--line);object-fit:cover;cursor:zoom-in;background:var(--bg);padding:0}
.th img{width:100%;height:100%;object-fit:cover;border-radius:7px;display:block}
.tw{position:relative;display:inline-block}
.del{position:absolute;top:-7px;right:-7px;min-width:24px;height:24px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:700 13px var(--sans);cursor:pointer;padding:0 6px;line-height:1}
.del.arm{background:#c92a2a;color:#fff;border-color:#c92a2a}
.del:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.up{font:inherit;font-size:12.5px;border:1px dashed var(--muted);color:var(--muted);background:transparent;border-radius:8px;padding:6px 10px;cursor:pointer}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.lb{position:fixed;inset:0;background:rgba(10,8,8,.82);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:20}
.lb[hidden]{display:none}
.lb img{max-width:100%;max-height:82vh;border-radius:8px;background:#fff}
.lb p{color:#fff;margin:10px 0 0;text-align:center}
.lb button{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));font:inherit;background:#fff;color:#111;border:0;border-radius:999px;padding:6px 12px;cursor:pointer}
.msg{font-size:12.5px;color:var(--muted)}
.mapc[hidden]{display:none}
.mapc{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.maph{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 14px;padding:10px 16px;font-size:13px}
.maph b{font-size:13px}
.lg{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted);font-size:12.5px}
.lg i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.plan{position:relative}
.plan img{display:block;width:100%;height:auto}
.plan svg{position:absolute;inset:0;width:100%;height:100%}
.pin{cursor:pointer}
.pin text{font:700 17px var(--mono);fill:#fff;pointer-events:none}
.pin:focus-visible circle,.pin:focus-visible rect{stroke:#ffd400;stroke-width:6}
.prbtn{font:inherit;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}.prbtn:disabled{opacity:.5}
.addbtn{font:inherit;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:999px;padding:6px 14px;cursor:pointer}
.addf{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px 12px;align-items:end}
.addf[hidden]{display:none}
.addf label{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
.addf input,.addf select{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
.addf .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.addf button{font:inherit;border-radius:8px;padding:7px 12px;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.addf button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.addf .fh{grid-column:1/-1;margin:0;font-size:15px}
.addf .chk[hidden]{display:none}
.pins-ed{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 8px;font-size:12.5px;color:var(--muted);align-items:center}
.pins-ed .pe{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:8px;padding:3px 4px 3px 8px;background:var(--bg)}
.pins-ed .pe input{width:130px;padding:4px 6px;font-size:13px}
.pins-ed .pe button{padding:3px 8px}
.lnk{font-size:12.5px;margin-top:3px}
.who{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:4px;font-size:13px}
.who .wl{font-size:11.5px;color:var(--muted)}
.who b{font-size:14px;padding:1px 9px;border-radius:999px;background:var(--accent-soft);color:var(--ink)}
.who .none{color:var(--muted);font-style:normal;padding:1px 9px;border:1px dashed var(--line);border-radius:999px}
.addf label[hidden]{display:none}
.lnk a{color:var(--accent);font-weight:500}
.card .tot{font-size:12px;color:var(--muted);margin-top:8px}.card .tot b{color:var(--ink);font-size:13px}
.prc{font-size:13px;margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}.prc .wl{font-size:11.5px;color:var(--muted)}.prc b{font-variant-numeric:tabular-nums}.prc .pn{color:var(--muted);font-size:12px}
.mv.fx{color:var(--accent)}
.lnk a+a{margin-left:4px}
.stf{display:flex;gap:6px;flex-wrap:wrap}.stf button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.stf button i{width:9px;height:9px;border-radius:50%;display:inline-block}.stf button b{font-weight:500;color:var(--muted)}.stf button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}.stf button[aria-pressed="true"] b{color:inherit}
.mapv{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 10px}.mapv button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}.mapv button b{font-weight:500;color:var(--muted);margin-left:4px}.mapv button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}.mapv button[aria-pressed="true"] b{color:inherit}
.pe small{color:var(--muted);font-size:11.5px;margin-left:2px}
.vwrap{padding:12px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.vcard{border:1px solid var(--line);border-left:8px solid var(--vc);border-radius:10px;padding:12px 14px;display:grid;gap:6px;background:var(--paper);align-content:start}
.vh{display:flex;gap:8px;align-items:center}.vn{font-weight:700;color:var(--vc)}.vh .mv:first-of-type{margin-left:auto}
.vf{display:grid;grid-template-columns:70px minmax(0,1fr);gap:6px;align-items:center;font-size:13px}.vf>span{color:var(--muted);font-size:12px}.vf b{font-weight:600;overflow-wrap:anywhere}
.vf input{font:inherit;font-size:13px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);min-width:0}
.vits{font-size:12.5px;color:var(--muted)}.vadd{font:inherit;border:1px dashed var(--muted);border-radius:10px;background:none;color:var(--muted);cursor:pointer;min-height:90px}
.vread{font-size:12.5px;color:var(--accent)}.vchip{font-size:12px;padding:1px 10px;border-radius:999px;color:#fff;background:var(--vc);font-weight:600}
.row.vrow{box-shadow:inset 7px 0 0 var(--vc)}.pay select[data-vsel]:not([data-v=""]){border-left-color:var(--vc)}
.vpl{max-height:55vh;overflow:auto;display:grid;gap:2px;border:1px solid var(--line);border-radius:8px;padding:6px}.vpl label{display:flex;gap:8px;align-items:center;padding:5px 6px;border-radius:6px;font-size:14px;cursor:pointer}.vpl label:hover{background:var(--bg)}.vpl small{color:var(--muted);margin-left:auto;font-size:12px}
.dlgc.wide{max-width:620px}.gpsum{display:flex;gap:10px;align-items:center;font-size:14px}.gpsum .bar{flex:1;height:10px}
.gpl{max-height:60vh;overflow:auto;display:grid;gap:6px}.gpi{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;font:inherit;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);padding:6px 10px 6px 6px;cursor:pointer}
.gpi:hover{border-color:var(--muted)}.gpi img,.gpi .ni{width:52px;height:52px;border-radius:8px;object-fit:cover;background:var(--bg);border:1px solid var(--line)}.gpi b{display:block;font-size:14px}.gpi small{color:var(--muted);font-size:12.5px}
.gpi .gs{font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;color:#fff;background:var(--gc);white-space:nowrap}
.tdadd{display:flex;gap:8px;padding:12px 16px;flex-wrap:wrap;border-bottom:1px solid var(--line)}.tdadd input{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0}
#td-text{flex:1 1 280px}#td-who{width:150px}.tdadd button{font:inherit;border-radius:8px;padding:7px 16px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:#fff}
.td{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:4px 10px;padding:12px 16px;border-top:1px solid var(--line);align-items:start}.td:first-of-type{border-top:0}
.tdck input{width:20px;height:20px;margin:3px 0 0;accent-color:var(--done);cursor:pointer}
.tdt{display:block;width:100%;font:inherit;font-size:15px;font-weight:600;color:var(--ink);border:1px solid transparent;border-radius:6px;background:none;padding:2px 6px;margin-left:-6px}input.tdt:hover,input.tdt:focus{border-color:var(--line);background:var(--bg)}
.td.done .tdt{text-decoration:line-through;color:var(--muted)}
.tdh{display:block;width:100%;box-sizing:border-box;margin-top:4px;font-family:var(--sans);font-style:normal;font-size:13.5px;line-height:1.5;color:var(--done);background:color-mix(in srgb,var(--done) 9%,transparent);border:0;border-left:3px solid var(--done);border-radius:0 6px 6px 0;padding:5px 10px;resize:vertical;min-height:30px}
.tdh::placeholder{color:var(--muted);font-style:normal}div.tdh::before{content:"↳ "}
.tdm{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap;justify-content:flex-end}.tdm>span{white-space:nowrap}.tdw{width:110px;font:inherit;font-size:12.5px;padding:3px 8px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink)}span.tdw{width:auto;background:var(--accent-soft);border-color:transparent}
.sec{margin-top:6px;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sec .mv{color:var(--accent)}
.sec.open{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}.sech{font-size:12px;color:var(--muted);grid-column:1/-1}
.secz{border:1px dashed var(--line);border-radius:8px;padding:6px 8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:52px}.secz .wl{font-size:12px;color:var(--muted);width:100%}
.sth{width:56px;height:56px}.sth img{width:100%;height:100%;object-fit:cover;border-radius:7px;display:block;-webkit-user-drag:none;user-select:none}
.dlgc input[type=password]{font:inherit;font-size:16px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}.secerr{color:#e03131;font-size:13px;min-height:1.2em;margin:0}
#lb.sec img{-webkit-user-drag:none;user-select:none;pointer-events:none}
.who .sz{font:inherit;font-size:13px;width:auto;padding:3px 6px;border-left-width:1px;margin-left:4px}.sztally{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-size:13.5px;color:var(--muted)}.sztally b{color:var(--ink)}
.rdo{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--ink);margin-left:6px;cursor:pointer;white-space:nowrap}.rdo input{width:16px;height:16px;accent-color:var(--accent);margin:0}
.rdob{font-size:12px;padding:1px 9px;border-radius:999px;background:var(--accent-soft);color:var(--ink);margin-left:4px}.rdot{margin-left:14px;padding-left:14px;border-left:1px solid var(--line)}
.who .tel{width:130px;font:inherit;font-size:13px;padding:3px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);margin-left:4px}
#lbdl{position:absolute;top:16px;right:96px;font:inherit;font-size:14px;border:0;border-radius:8px;padding:8px 14px;background:#fff;color:#111;cursor:pointer}#lb.sec #lbdl{display:none}
.vgrip{cursor:grab;font-size:20px;line-height:1;color:var(--muted);padding:2px 4px;user-select:none}.vgrip:active{cursor:grabbing}
.vmv{display:inline-flex;flex-direction:column;gap:1px}.vmv button{font:inherit;font-size:9px;line-height:1;border:1px solid var(--line);background:var(--paper);color:var(--muted);border-radius:4px;padding:2px 5px;cursor:pointer}.vmv button:hover{color:var(--ink)}
.vjc.vdrag{opacity:.4}.vjc.vbefore{box-shadow:inset 0 3px 0 var(--accent)}.vjc.vafter{box-shadow:inset 0 -3px 0 var(--accent)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:calc(100% - 32px);box-shadow:0 4px 16px rgba(0,0,0,.25)}
.bmkl{display:inline-block;font-weight:700;color:#fff;background:var(--accent);border-radius:999px;padding:5px 14px;text-decoration:none;cursor:grab}

.dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:55;padding:16px}
.dlgc{background:var(--paper);color:var(--ink);border-radius:14px;padding:20px 22px;max-width:440px;width:100%;display:grid;gap:12px;font-size:15px;line-height:1.55}
.dlgc h3{margin:0;font-size:17px}.dlgc p{margin:0}.dlgc small{color:var(--muted);font-size:13px}
.dlgc .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:11px;background:var(--accent);color:#fff;font-size:13px;font-weight:700;margin-right:6px}
.bmpic{border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:12.5px}.bmpic>div{padding:6px 10px;display:flex;gap:8px;align-items:center}.bmpic span{flex:1;background:var(--bg);border-radius:999px;padding:2px 10px;color:var(--muted)}.bmpic i{font-style:normal;color:var(--muted);margin-left:auto}
.bmpic .r2{border:2px solid var(--accent);background:var(--accent-soft)}.bmpic .r2 b{background:var(--accent);color:#fff;border-radius:999px;padding:1px 9px}.bmpic .r2 i{color:var(--accent);font-weight:700}
.dlgc .acts{display:flex;gap:8px;justify-content:flex-end}.dlgc .acts button{font:inherit;font-size:14px;border-radius:8px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.dlgc .acts .pri{background:var(--accent);border-color:var(--accent);color:#fff}
.hp{display:flow-root}.pim{float:left;position:relative;width:72px;height:72px;margin:0 12px 6px 0;border-radius:8px}
.pim .pup{width:72px;height:72px;padding:0;line-height:1.35;font-size:12px}.pim.none{border:1px dashed var(--line);background:var(--bg)}
.secz.over,.pim.over,.proofs.over,.sbox.over{outline:2px dashed var(--accent);outline-offset:3px;background:var(--accent-soft);border-radius:8px}.lned{display:grid;gap:4px;justify-items:start}.lni{font:inherit;font-size:13px;width:min(100%,360px);padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.row.hs{grid-template-columns:minmax(0,1fr) 64px 220px}.row.hs>div:first-child{grid-row:span 2}
.side{grid-column:2/-1;display:grid;gap:6px;align-content:start}
.pay{display:flex;flex-wrap:wrap;gap:6px}
.pay select.ps{width:auto;flex:1 1 96px;border-left-width:5px;border-left-color:var(--line)}.pay select.ps[data-v=""]{color:var(--muted)}

<script>
const ST={design:['미착수','디자인 완료','출력 발주','설치 완료'],rent:['미발주','결제 완료','입고 완료'],buy:['미구매','결제 완료','입고 완료'],staff:['미배정','배정 완료','당일 확인']};
const KN={design:'디자인',rent:'대여',buy:'구매',staff:'인력'};
let rows=[],kind='design',openOnly=false,stF=null,db=null,assets=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// 링크: 첫 번째는 link, 나머지는 links 배열
const linksOf=r=>[r.link,...(r.links||[])].filter(Boolean);
const hostOf=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return '링크'}};
// ── 자동 가져오기: 즐겨찾기 버튼(북마클릿)이 상품 페이지에서 사진·가격을 읽어 이 페이지를 #fill=… 로 열어 줌 ──
const PAGE=location.origin+location.pathname;
const BMK_SRC=`(()=>{const P='${PAGE}';let img='',price=0,name='';const pr=v=>+String(v||'').replace(/[^\\d.]/g,'')||0,q=s=>document.querySelector(s);
for(const s of document.querySelectorAll('script[type="application/ld+json"]')){try{const j=JSON.parse(s.textContent);for(const o of [].concat(j,j['@graph']||[])){if(o&&/Product/.test(o['@type'])){name=name||o.name||'';const im=[].concat(o.image||[])[0];img=img||(typeof im==='string'?im:im&&im.url)||'';const f=[].concat(o.offers||[])[0]||{};price=price||pr(f.price||f.lowPrice)}}}catch(e){}}
price=price||pr(q('.final-price-amount')&&q('.final-price-amount').textContent)||pr(q('meta[property="product:price:amount"]')&&q('meta[property="product:price:amount"]').content);
img=img||(q('meta[property="og:image"]')&&q('meta[property="og:image"]').content)||'';if(img.startsWith('//'))img='https:'+img;else if(img&&!/^https?:/.test(img))img=new URL(img,location.href).href;
name=name||(q('meta[property="og:title"]')&&q('meta[property="og:title"]').content)||document.title;
if(!img&&!price){alert('이 페이지에서 사진이나 가격을 찾지 못했어요.');return}
window.open(P+'#fill='+encodeURIComponent(JSON.stringify({u:location.href,img:img,price:price,name:String(name).slice(0,80)})),'_blank');setTimeout(()=>window.close(),300)})()`;
const BMK='javascript:'+encodeURIComponent(BMK_SRC.replace(/\n/g,''));
let bmkUsed=false;try{bmkUsed=localStorage.getItem('bmkUsed')==='1'}catch(e){}
const toast=t=>{let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{el.hidden=true},6000)};
const pkey=u=>{try{const x=new URL(u),m=x.pathname.match(/\/(?:vp|vm)\/products\/(\d+)/);return m?'cp:'+m[1]:x.host.replace(/^(www|m)\./,'')+x.pathname.replace(/\/$/,'')+(x.searchParams.get('id')?'?id='+x.searchParams.get('id'):'')}catch(e){return u}};
let fill=null;try{if(location.hash.startsWith('#fill=')){fill=JSON.parse(decodeURIComponent(location.hash.slice(6)));history.replaceState(null,'',location.pathname+location.search)}}catch(e){}
// 처음 쓰는 사람용 안내 창: ⭐ 버튼을 즐겨찾기 줄에 놓고 → 상품 페이지에서 누르기
function grabHelp(r){const d=document.createElement('div');d.className='dlg';
  d.innerHTML=`<div class="dlgc" role="dialog" aria-modal="true" aria-label="사진과 가격 자동으로 넣기"><h3>사진과 가격 자동으로 넣기</h3>
  <p><span class="n">1</span>처음 한 번만 해 주세요. 아래 빨간 버튼을 마우스로 꾹 잡고, 크롬 <b>주소창 바로 아래 줄</b>에 끌어다 놓으세요.</p>
  <div class="bmpic"><div class="r1">← → ⟳ <span>coupang.com/…</span> <i>← 주소창</i></div><div class="r2">네이버 · 유튜브 · <b>⭐ 현황판에 담기</b> <i>← 여기에 놓기</i></div></div>
  <p><small>주소창 아래에 그 줄이 안 보이면 키보드에서 Cmd + Shift + B 를 같이 누르면 나타나요.</small></p>
  <p style="text-align:center"><a class="bmkl" href="${esc(BMK)}">⭐ 현황판에 담기</a></p>
  <p><span class="n">2</span>아래 <b>상품 페이지 열기</b>를 누르세요.</p>
  <p><span class="n">3</span>열린 상품 페이지에서, 주소창 아래 줄의 <b>⭐ 현황판에 담기</b>를 누르세요. 사진과 가격이 자동으로 들어와요.</p>
  <div class="acts"><button type="button" data-x>닫기</button><button type="button" class="pri" data-go>상품 페이지 열기</button></div></div>`;
  document.body.appendChild(d);const close=()=>d.remove();
  d.addEventListener('click',e=>{if(e.target===d||e.target.closest('[data-x]'))close();else if(e.target.closest('[data-go]')){window.open(linksOf(r)[0],'_blank');close()}else if(e.target.closest('.bmkl')){e.preventDefault();toast('누르지 말고, 크롬 주소창 바로 아래 줄로 끌어다 놓아 주세요.')}});
  d.addEventListener('keydown',e=>{if(e.key==='Escape')close()});d.querySelector('[data-go]').focus()}
async function tryFill(){if(!fill||!rows.length||canW===null)return;const f=fill;fill=null;
  if(!canW){toast('편집 비밀번호로 들어온 뒤 다시 눌러 주세요.');return}
  let g=null;try{g=JSON.parse(localStorage.getItem('grabFor')||'null')}catch(e){}
  const k=pkey(f.u);let r=rows.find(x=>x.kind==='buy'&&linksOf(x).some(u=>pkey(u)===k));
  if(!r&&g&&Date.now()-g.t<36e5)r=rows.find(x=>x.id===g.id);
  if(!r){toast('어느 물품인지 찾지 못했어요. 현황판에서 물품 옆 ‘가져오기’를 먼저 눌러 주세요.');return}
  const patch={};if(f.img&&/^https?:\/\//.test(f.img))patch.pimg=f.img;if(+f.price>0)patch.price=Math.round(+f.price);
  try{await db.doc('items/'+r.id).update(patch);try{localStorage.removeItem('grabFor');localStorage.setItem('bmkUsed','1')}catch(e){}
    setTab('buy');render();const got=[patch.pimg?'사진':'',patch.price?'가격 '+won(patch.price):''].filter(Boolean).join('과 ');
    toast(`${r.name}: ${got}을 넣었어요. 이 탭은 곧 닫혀요.`);setTimeout(()=>{try{window.close()}catch(e){}},3000)}
  catch(err){toast('넣지 못했어요. 편집 비밀번호로 들어왔는지 확인해 주세요.')}}
// 대여·구매 물품 대표 이미지 (pimg). 편집자는 눌러서 올리거나 끌어다 놓기
function pimHTML(r){if(r.kind!=='buy'&&r.kind!=='rent')return '';const ed=assets&&ED();
  if(r.pimg)return `<div class="pim"${ed?` data-dz="p:${r.id}"`:''}><button type="button" class="th" data-img="${esc(r.pimg)}" data-cap="${esc(r.name)}" aria-label="${esc(r.name)} 이미지 크게 보기"><img src="${esc(BLOB(r.pimg))}" alt="" loading="lazy"></button>${ed?`<button type="button" class="del" data-pdel="${r.id}" aria-label="${esc(r.name)} 이미지 삭제">×</button>`:''}</div>`;
  return ed?`<div class="pim" data-dz="p:${r.id}"><button type="button" class="up pup" data-pup="${r.id}">이미지<br>추가</button></div>`:'<div class="pim none"></div>'}
// 오른쪽 칸: 대여·구매는 결제 방식/세금계산서, 물품(디자인·대여·구매)은 메모

  db.collection('meta').orderBy('o').onSnapshot(s=>{todos=s.docs.filter(d=>d.id.startsWith('t-')).map(d=>({id:d.id,...d.data()}));render()},()=>{});
  db.doc('meta/rent').onSnapshot(s=>{const d=s&&s.exists&&s.data?s.data():null;rentRc=(d&&d.rcpts)||[];rentV=(d&&d.vendors)||[];render()},()=>{});
  db.collection('items').orderBy('o').onSnapshot(s=>{rows=s.docs.map(d=>({id:d.id,...d.data()}));render();tryFill()},()=>{$('#msg').textContent='목록을 불러오지 못했어요.'});
})();
</script>
</html>
